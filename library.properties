name=Multitasker
version=1.0.1
author=Jens D. Madsen
maintainer=Jens D. Madsen
sentence=Lightweight cooperative multitasking for Arduino AVR using independent task stacks.
paragraph=Simple and deterministic cooperative multitasking using stack pointer switching. Each task has its own stack, preserving the complete execution state across task switches. Ideal for resource-constrained AVR boards such as Arduino Nano. Supports yield(), delay(), manual task switching and custom schedulers.
